name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type check (mypy)
        run: mypy app/ --cache-dir=/tmp/mypy_cache

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Unit + API tests
        run: pytest tests/ -v

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: worker/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Tests
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint (eslint)
        run: npx eslint . --ext ts,tsx

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high || true # informational until a triage process exists

  docker-integration:
    runs-on: ubuntu-latest
    needs: [backend, worker, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral JWT keypair and .env for CI
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ci_private.pem
          openssl rsa -pubout -in /tmp/ci_private.pem -out /tmp/ci_public.pem
          {
            echo "POSTGRES_USER=sigmaforge"
            echo "POSTGRES_PASSWORD=ci-only-password"
            echo "POSTGRES_DB=sigmaforge"
            echo "MINIO_ROOT_USER=sigmaforge"
            echo "MINIO_ROOT_PASSWORD=ci-only-password-2"
            echo "JWT_PRIVATE_KEY=$(awk 'BEGIN{ORS="\\n"} {print}' /tmp/ci_private.pem)"
            echo "JWT_PUBLIC_KEY=$(awk 'BEGIN{ORS="\\n"} {print}' /tmp/ci_public.pem)"
          } > .env

      - name: Build and wait for required services
        working-directory: infra
        run: docker compose --env-file ../.env up -d --build --wait --wait-timeout 240 postgres redis api worker frontend

      - name: Capture logs on failure
        if: failure()
        working-directory: infra
        run: docker compose --env-file ../.env logs --no-color --tail=150

      - name: Smoke test the API
        run: |
          curl -f http://localhost:8000/healthz
          curl -f http://localhost:8000/readyz

      - name: Tear down
        if: always()
        working-directory: infra
        run: docker compose --env-file ../.env down -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0 # informational until a documented triage/exception process exists

postgres-rule-integration:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigmaforge_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sigmaforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigmaforge_ci -d sigmaforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://sigmaforge_ci:ci-only-password@localhost:5432/sigmaforge_ci
      SIGMAFORGE_TEST_POSTGRES_URL: postgresql+asyncpg://sigmaforge_ci:ci-only-password@localhost:5432/sigmaforge_ci
      # Alembic only needs the DB URL; the HTTP fixture generates a test RSA keypair.
      JWT_PRIVATE_KEY: migration-only-unused
      JWT_PUBLIC_KEY: migration-only-unused
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply production Alembic schema to disposable PostgreSQL
        run: alembic upgrade head

      - name: Exercise authenticated rule creation and rollback against PostgreSQL
        run: pytest tests/integration/test_rule_create_postgres.py -v
