name: CI

on:
  pull_request:
  push:
    branches: [main]

# All jobs only read repository contents; do not grant the default token write access.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate installed Python dependencies
        run: python -m pip check

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type check (mypy)
        run: mypy app/ --cache-dir=/tmp/mypy_cache

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Unit + API tests
        run: pytest tests/ -v

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: worker/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate installed Python dependencies
        run: python -m pip check

      - name: Lint (ruff)
        run: ruff check app/

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Tests
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint (eslint)
        run: npx eslint . --ext ts,tsx

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Dependency vulnerability scan (npm audit)
        run: |
          # Preserve the complete advisory report for triage without making existing
          # findings block unrelated pull requests until an exception policy exists.
          npm audit --json > npm-audit.json || true
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("npm-audit.json","utf8")); if(r.error){console.error(r.error); process.exitCode=1} else {console.log("npm audit vulnerability counts:",JSON.stringify(r.metadata?.vulnerabilities ?? {}))}'

      - name: Upload npm audit report for triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit
          path: frontend/npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, worker, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral JWT keypair and .env for CI
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ci_private.pem
          openssl rsa -pubout -in /tmp/ci_private.pem -out /tmp/ci_public.pem
          {
            echo "POSTGRES_USER=sigmaforge"
            echo "POSTGRES_PASSWORD=ci-only-password"
            echo "POSTGRES_DB=sigmaforge"
            echo "MINIO_ROOT_USER=sigmaforge"
            echo "MINIO_ROOT_PASSWORD=ci-only-password-2"
            echo "JWT_PRIVATE_KEY=$(awk 'BEGIN{ORS="\\n"} {print}' /tmp/ci_private.pem)"
            echo "JWT_PUBLIC_KEY=$(awk 'BEGIN{ORS="\\n"} {print}' /tmp/ci_public.pem)"
          } > .env

      - name: Build and wait for required services
        working-directory: infra
        run: docker compose --env-file ../.env up -d --build --wait --wait-timeout 240 postgres redis api worker frontend

      - name: Capture logs on failure
        if: failure()
        working-directory: infra
        run: docker compose --env-file ../.env logs --no-color --tail=150

      - name: Smoke test the API
        run: |
          curl -f http://localhost:8000/healthz
          curl -f http://localhost:8000/readyz

      - name: Tear down
        if: always()
        working-directory: infra
        run: docker compose --env-file ../.env down -v

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0 # informational until a documented triage/exception process exists
          format: json
          output: trivy-results.json

      - name: Validate Trivy JSON report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("trivy-results.json").read_text(encoding="utf-8"))
          if not isinstance(report, dict) or not isinstance(report.get("SchemaVersion"), int):
              raise SystemExit("Trivy report is missing a valid SchemaVersion")
          if "Results" not in report or not isinstance(report["Results"], list):
              raise SystemExit("Trivy report must contain a Results list")
          results = report["Results"]
          count = 0
          for index, item in enumerate(results):
              if not isinstance(item, dict) or not isinstance(item.get("Target"), str):
                  raise SystemExit(f"Trivy result {index} must have a string Target")
              vulnerabilities = item.get("Vulnerabilities", [])
              if not isinstance(vulnerabilities, list):
                  raise SystemExit(f"Trivy result {index} Vulnerabilities must be a list")
              if not all(isinstance(vulnerability, dict) for vulnerability in vulnerabilities):
                  raise SystemExit(f"Trivy result {index} contains a non-object vulnerability")
              count += len(vulnerabilities)
          print(f"Trivy report validated: {len(results)} targets, {count} vulnerability findings")
          PY

      - name: Upload Trivy vulnerability report for triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-trivy-report
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 14

  postgres-rule-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigmaforge_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sigmaforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigmaforge_ci -d sigmaforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://sigmaforge_ci:ci-only-password@localhost:5432/sigmaforge_ci
      SIGMAFORGE_TEST_POSTGRES_URL: postgresql+asyncpg://sigmaforge_ci:ci-only-password@localhost:5432/sigmaforge_ci
      # Alembic only needs the DB URL; the HTTP fixture generates a test RSA keypair.
      JWT_PRIVATE_KEY: migration-only-unused
      JWT_PUBLIC_KEY: migration-only-unused
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate PostgreSQL integration dependencies
        run: python -m pip check

      - name: Apply production Alembic schema to disposable PostgreSQL
        run: alembic upgrade head

      - name: Exercise rule persistence and concurrent refresh consumption against PostgreSQL
        run: pytest tests/integration/test_rule_create_postgres.py tests/integration/test_refresh_token_postgres.py -v
