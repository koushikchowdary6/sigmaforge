name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type check (mypy)
        run: mypy app/ --cache-dir=/tmp/mypy_cache

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Unit + API tests
        run: pytest tests/ -v

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: worker/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Tests
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint (eslint)
        run: npx eslint . --ext ts,tsx

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high || true # informational until a triage process exists

  docker-integration:
    runs-on: ubuntu-latest
    needs: [backend, worker, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral JWT keypair and .env for CI
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ci_private.pem
          openssl rsa -pubout -in /tmp/ci_private.pem -out /tmp/ci_public.pem
          {
            echo "POSTGRES_USER=sigmaforge"
            echo "POSTGRES_PASSWORD=ci-only-password"
            echo "POSTGRES_DB=sigmaforge"
            echo "MINIO_ROOT_USER=sigmaforge"
            echo "MINIO_ROOT_PASSWORD=ci-only-password-2"
            echo "JWT_PRIVATE_KEY=$(awk 'BEGIN{ORS="\\n"} {print}' /tmp/ci_private.pem)"
            echo "JWT_PUBLIC_KEY=$(awk 'BEGIN{ORS="\\n"} {print}' /tmp/ci_public.pem)"
          } > .env

      - name: Build and start the full stack
        working-directory: infra
        run: docker compose --env-file ../.env up -d --build

      - name: Wait for all services to report healthy
        run: |
          for i in $(seq 1 30); do
            unhealthy=$(docker ps --filter "health=unhealthy" --format '{{.Names}}')
            starting=$(docker ps --filter "health=starting" --format '{{.Names}}')
            if [ -z "$unhealthy" ] && [ -z "$starting" ]; then
              echo "All services healthy."
              exit 0
            fi
            echo "Waiting for services to become healthy (attempt $i)..."
            sleep 5
          done
          echo "Services did not become healthy in time."
          docker compose -f infra/docker-compose.yml ps
          docker compose -f infra/docker-compose.yml logs
          exit 1

      - name: Smoke test the API
        run: |
          curl -f http://localhost:8000/healthz
          curl -f http://localhost:8000/readyz

      - name: Tear down
        if: always()
        working-directory: infra
        run: docker compose down -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0 # informational until a documented triage/exception process exists
