name: Feature Request
description: Propose a new capability or improvement
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - engineering
        - research
    validations:
      required: true
